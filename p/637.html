<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>商城開始搶先試營運｜神之領域 日版資料庫</title><link rel="stylesheet" href="../style.css"></head><body><header><a class="home" href="../index.html">神之領域 日版資料庫</a><form class="sf" action="../index.html"><input name="q" placeholder="搜尋頁名（中文或日文）" aria-label="搜尋"></form></header><main><nav class="crumb"><a href="../c/11_官方公告.html">官方公告</a></nav><h1>商城開始搶先試營運</h1><div class="orig">キャッシュショップのプレオープンを開始しました　<a href="https://ikiwiki.jp/asgard/%E3%82%AD%E3%83%A3%E3%83%83%E3%82%B7%E3%83%A5%E3%82%B7%E3%83%A7%E3%83%83%E3%83%97%E3%81%AE%E3%83%97%E3%83%AC%E3%82%AA%E3%83%BC%E3%83%97%E3%83%B3%E3%82%92%E9%96%8B%E5%A7%8B%E3%81%97%E3%81%BE%E3%81%97%E3%81%9F" rel="nofollow">日文原頁</a></div><p>感謝您平日對『神之領域』的愛護。</p><p>今天2月23日（四）13:00，商城功能開始搶先試營運。</p><p>可以從遊戲畫面右下角的「商店」按鈕開啟商店頁面。</p><p>關於搶先試營運期間商店道具的處理方式，請參閱另行公告。</p><p>此外，預定於2月28日（二）正式開始服務。</p><p>今後也請多多支持『神之領域』。</p><p>神之領域營運團隊</p></main><footer>內容翻譯自日版 wiki（wikiwiki.jp/asgard）玩家整理的資料，僅供參考；原文著作權屬原作者。灰色斜體＝尚未翻譯的原文。</footer></body></html>
